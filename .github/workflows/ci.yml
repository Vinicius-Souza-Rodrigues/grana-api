name: CI

on:
  push:
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Grana.slnx

      - name: Build
        run: dotnet build Grana.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Grana.slnx --no-build --configuration Release --verbosity normal
